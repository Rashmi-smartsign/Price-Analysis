  const ST={'Jun':'None (before)','Jul':g.steps.some(s=>s.date.slice(5,7)==='07')?'R1: 01–29 Jul':'','Aug':g.steps.some(s=>s.date.slice(5,7)==='08')?'R1: 05, 12 Aug':'','Sep':g.steps.some(s=>s.date.slice(5,7)==='09')?'R2: 16, 23, 30 Sep':'','Oct 1-10':g.steps.some(s=>s.date==='2026-10-07')?'R2: 07 Oct':''};
  g.months.forEach((mo,i)=>rows+=row(mo==='Oct 1-10'?'Oct 1–10':mo,ST[mo],k=>m[k][i],i===1?'split':''));
  return `<table>${HEAD('Month')}<tbody>${rows}</tbody></table>`;}
